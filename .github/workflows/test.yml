name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python tests/run.py
      - shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $parseFailures += $parseErrors
          }
          if ($parseFailures.Count) { throw ($parseFailures | Out-String) }
          & .\tests\check_process_ownership.ps1
